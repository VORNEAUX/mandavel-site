.bt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .95rem var(--tx);padding:12px 22px;border-radius:99px;cursor:pointer;text-decoration:none;min-height:46px;position:relative;overflow:hidden;transition:transform .3s var(--e),border-color .2s,background .2s,color .2s}

function frame(){requestAnimationFrame(frame);const h=$('.hero');if(h){px+=(tx-px)*.06;py+=(ty-py)*.06;h.style.setProperty('--px',px.toFixed(3));h.style.setProperty('--py',py.toFixed(3))}
const k=$('#stk');if(k){const r=k._r||(k._r={x:0,y:0,tx:0,ty:0});r.x+=(r.tx-r.x)*.1;r.y+=(r.ty-r.y)*.1;k.style.transform=`rotateX(${58+r.y}deg) rotateZ(${-32+r.x}deg)`}}
addEventListener('pointermove',e=>{if(!FINE)return;tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5;const k=$('#stk');if(k&&k._r){const b=k.parentElement.getBoundingClientRect();k._r.tx=((e.clientX-b.left)/b.width-.5)*14;k._r.ty=((e.clientY-b.top)/b.height-.5)*-10}},{passive:true});
addEventListener('scroll',scrollFx,{passive:true});addEventListener('resize',placeLine);
/* ---------- azioni ---------- */
const say=(el,msg,cls='er')=>{el.hidden=!msg;el.textContent=msg||'';el.className=cls};
const fieldErr=(id,m)=>{const e=$('#e-'+id),i=$('#'+id);if(e){e.hidden=!m;e.textContent=m||''}if(i)i.setAttribute('aria-invalid',!!m);return m};
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;
if(t.id==='th'){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('mv-theme',n)}catch{}ui()}
else if(t.id==='mb'){const o=ov.classList.toggle('open');t.setAttribute('aria-expanded',o);document.body.style.overflow=o?'hidden':'';t.textContent=o?'Chiudi':'Mappa';if(o){hdr.classList.remove('h');setTimeout(()=>$('a',ov).focus({preventScroll:true}),500)}}
else if(t.closest('#nav')&&t.tagName==='A'){closeOv();document.body.style.overflow='';$('#mb').textContent='Mappa'}
else if(d.m){const v=t.closest('.vz');v.dataset.m=d.m;$$('button',t.parentElement).forEach(b=>b.setAttribute('aria-pressed',b===t))}
else if(t.classList.contains('pk')){const v=t.closest('.vz');$$('.pk',v).forEach(b=>b.setAttribute('aria-pressed',b===t));$('.cap',v).textContent=d.d;if(v.classList.contains('flow')){const i=$$('.pk',v).indexOf(t);v.style.setProperty('--s',i)}}
else if(t.id==='spread'){const o=t.getAttribute('aria-pressed')!=='true';t.setAttribute('aria-pressed',o);t.closest('.exs').classList.toggle('open',o);t.textContent=o?'Riunisci i livelli':'Separa i livelli'}
else if(d.aud!==undefined&&t.classList.contains('chip')){AUDF=d.aud;$$('.bar2 .chip').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#rank').innerHTML=rankHTML()}
else if(d.vote){const msg=$('#vmsg');say(msg,'');t.disabled=true;const on=t.getAttribute('aria-pressed')!=='true',r=$('#rank'),f=new Map($$('li',r).map(l=>[l.dataset.id,l.getBoundingClientRect().top]));
try{const j=await api('/vote',{method:'POST',body:{id:d.vote,on}});FUT=j.services;r.innerHTML=rankHTML();if(!RM)$$('li',r).forEach(l=>{const o=f.get(l.dataset.id);if(o==null)return;const dy=o-l.getBoundingClientRect().top;if(dy)l.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})});$$('[data-vote]',r).find(b=>b.dataset.vote===d.vote)?.focus()}
catch(x){say(msg,x.message);t.disabled=false}}});
document.addEventListener('input',e=>{if(e.target.id==='ba')e.target.closest('.ba').style.setProperty('--x',e.target.value+'%')});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
if(f.id==='pf'){const o=$('#pout'),b=$('button',f);let bad=0;bad+=!!fieldErr('pn',$('#pn').value.trim().length<3?'Indica il nome del servizio (almeno 3 caratteri).':'');bad+=!!fieldErr('pp',$('#pp').value.trim().length<20?'Descrivi il problema in almeno 20 caratteri.':'');bad+=!!fieldErr('px',$('#px').value.trim().length<20?'Descrivi la soluzione attesa in almeno 20 caratteri.':'');if(bad){$('[aria-invalid=true]',f).focus();return}
b.disabled=true;o.textContent='Invio in corso…';try{const j=await api('/proposals',{method:'POST',body:{name:$('#pn').value,problem:$('#pp').value,expected:$('#px').value,audience:$('#pa').value,website:$('#pw').value,t:Date.now()-FORM_T}});o.innerHTML=`<p class="ok"><b>Proposta ricevuta.</b> Sarà esaminata prima della pubblicazione. Il tuo codice per seguirla: <code>${esc(j.code)}</code></p>`;f.reset()}catch(x){o.innerHTML=`<p class="er">${esc(x.message)}</p>`;b.disabled=false;return}b.disabled=false}
else if(f.id==='tf'){const o=$('#tout'),c=$('#tc').value.trim().toUpperCase();if(!/^[A-Z0-9]{8}$/.test(c)){o.innerHTML='<p class="er">Il codice ha 8 caratteri.</p>';return}try{const j=await api('/proposals/'+c);o.innerHTML=`<p><b>${esc(j.name)}</b><br>${esc(j.status)}</p>`}catch(x){o.innerHTML=`<p class="er">${esc(x.status===404?'Codice non trovato.':x.message)}</p>`}}
else if(f.id==='rf'){const o=$('#rout'),b=$('button[type=submit]',f);let bad=0;
bad+=!!fieldErr('rs',$('#rs').value?'':'Scegli il servizio richiesto.');bad+=!!fieldErr('rb',$('#rb').value.trim().length<30?'Descrivi il progetto in almeno 30 caratteri.':'');bad+=!!fieldErr('rn',$('#rn').value.trim().length<2?'Inserisci nome e cognome.':'');bad+=!!fieldErr('re',/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test($('#re').value.trim())?'':'Inserisci un indirizzo email valido.');bad+=!!fieldErr('rc',$('#rc').checked?'':'Serve confermare di aver letto l’informativa.');
const rr=$('#rr').value.trim();bad+=!!fieldErr('rr',rr&&!/^https?:\/\//i.test(rr)?'Il link deve iniziare con http:// o https://.':'');if(bad){$('[aria-invalid=true]',f).focus();return}
const sv=$('#rs').value;b.disabled=true;o.textContent='Invio in corso…';try{const j=await api('/requests',{method:'POST',body:{service:sv==='Altro'?'Altro progetto':(byId(sv)?byId(sv).name:sv),kind:$('#rk').value,body:$('#rb').value,budget:$('#rg').value,timing:$('#rt').value,ref:rr,name:$('#rn').value,email:$('#re').value,phone:$('#rp').value,company:$('#ra').value,consent:true,website:$('#rw').value}});f.hidden=true;$('#rout').innerHTML='';f.insertAdjacentHTML('afterend',`<div class="done"><h2>Richiesta <em>ricevuta</em>.</h2><p>Il tuo codice di riferimento è <code>${esc(j.code)}</code>. Ti risponderemo all’indirizzo indicato.</p><a class="bt" href="#/servizi">Torna ai servizi</a></div>`)}catch(x){o.innerHTML=`<p class="er">${esc(x.message)}. I dati inseriti sono ancora qui: riprova.</p>`;b.disabled=false}}});
let FORM_T=Date.now();new MutationObserver(()=>{FORM_T=Date.now()}).observe(app,{childList:true});
addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('open')){closeOv();document.body.style.overflow='';$('#mb').textContent='Mappa'}});
ov.addEventListener('pointerover',e=>{const a=e.target.closest('a');if(a)$('#ovd').textContent=a.dataset.d||''});
function ui(){const d=document.documentElement.dataset.theme==='dark';$('#th').textContent='Tema';$('#th').setAttribute('aria-label',d?'Passa al tema chiaro':'Passa al tema scuro')}
addEventListener('hashchange',go);ui();nav();probe().then(()=>{if(cur==='prossimamente'||cur===''||cur==='richiedi')nav()});if(!RM)frame();
if(API!==false)setInterval(()=>{if(document.hidden||!API)return;if(cur==='prossimamente')loadFut().then(()=>{const r=$('#rank');if(r&&!r.contains(document.activeElement))r.innerHTML=rankHTML()}).catch(()=>{})},20000);
})();
